name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  c:
    name: C11 kernel (ASan + UBSan)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_BUILD_TYPE=Debug -DSAGE1_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: README sanitizer command (verbatim)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer native/sage1/sage1.c native/sage1/test_sage1.c -lm -o /tmp/uor-sage1-test
          /tmp/uor-sage1-test

  rust:
    name: Rust runtime (cargo test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: rust/sage1
        run: cargo test --all-targets
      - name: cargo test (release)
        working-directory: rust/sage1
        run: cargo test --release

  prolog:
    name: Prolog grammar (SWI-Prolog foreign library)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSAGE1_PROLOG=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  futhark:
    name: Futhark array backend (c, multicore, opencl via PoCL)
    runs-on: ubuntu-24.04
    env:
      FUTHARK_VERSION: 0.29.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Futhark
        run: |
          curl -fsSL -o futhark.tar.xz \
            https://github.com/diku-dk/futhark/releases/download/v${FUTHARK_VERSION}/futhark-${FUTHARK_VERSION}-linux-x86_64.tar.xz
          tar xf futhark.tar.xz
          echo "$PWD/futhark-${FUTHARK_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Install OpenCL (PoCL CPU device)
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev opencl-headers pocl-opencl-icd clinfo
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSAGE1_FUTHARK=ON "-DSAGE1_FUTHARK_BACKENDS=c;multicore;opencl"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -R futhark

  tinyapl:
    name: TinyAPL array engine vs C
    runs-on: ubuntu-24.04
    env:
      TINYAPL_COMMIT: db713c5a47ebf4d299055de0a598edd953df7e71
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.1'
          cabal-version: '3.12.1.0'
      - name: Fetch TinyAPL
        run: |
          git clone https://github.com/RubenVerg/tinyapl.git "$RUNNER_TEMP/tinyapl"
          git -C "$RUNNER_TEMP/tinyapl" checkout "$TINYAPL_COMMIT"
          # CLI-only build: drop the `edited` line editor (REPL key bindings only).
          sed -i '3s/.*/#if 0/' "$RUNNER_TEMP/tinyapl/app/TinyAPL/CLI.hs"
          sed -i 's/^        build-depends:edited$/        build-depends:/' "$RUNNER_TEMP/tinyapl/tinyapl.cabal"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ${{ runner.temp }}/tinyapl/dist-newstyle
          key: tinyapl-${{ env.TINYAPL_COMMIT }}-ghc-9.10.1
      - name: Build TinyAPL
        working-directory: ${{ runner.temp }}/tinyapl
        run: |
          cabal update
          cabal build exe:tinyapl -j2
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$(cabal list-bin exe:tinyapl)" "$RUNNER_TEMP/bin/tinyapl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSAGE1_TINYAPL=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -R apl
